<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:320px;padding:16px;background:#10151b;color:#eef}input,button{box-sizing:border-box;width:100%;padding:9px;margin:5px 0;border-radius:7px}button{background:#55d6be;border:0;font-weight:700}.danger{background:#ff6b6b}small{color:#9aa}#status{padding:8px 0}</style></head><body><h3>ATLAS Browser Bridge</h3><small>Only the active tab is shared. Passwords, cookies, and unrelated tabs are excluded.</small><input id="server" placeholder="https://your-atlas-host"><input id="token" placeholder="One-time pairing token"><button id="connect">Connect this tab</button><button id="disconnect" class="danger">Disconnect now</button><div id="status">Not connected</div><script src="popup.js"></script></body></html>
